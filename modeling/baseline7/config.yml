type: single-stage
device: cuda

extraction_process:
  data_cls: VolleyballTemporalDataset
  imgs_per_clip: 9
  group_level: false
  player_label: true
  enforce_sorting: false
  
  batch_size: 8
  pool: false
  save_dir_name: "b7_embds"

data:
  data_cls: EmbeddingsDataset

model:
  lstm_specs:
    input_size: 2048
    hidden_state_size: 1024
    num_layers: 1
    bidirectional: true

  player_head:
    linear_layer_size: 768
    p_dropout: 0.3
    num_classes: 9

  group_head:
    hidden_layer_sizes: [512, 128]
    p_dropout: 0.3
    num_classes: 8

training:
  epochs: &train_epochs 17
  train_batch_size: 32
  val_batch_size: 256
  lr: !!float 1e-4
  alpha: 0.3 # the loss balancing factor
  optimizer: AdamW
  weight_decay: 0.005

  scheduler:
    type: CosineAnnealingLR
    T_max: *train_epochs
    eta_min: !!float 1e-6

description: >
  This baseline is a variant of the final model, omitting 
  the group-level temporal model (LSTM 2). In other words, 
  we do the final classification based on the outputs of the 
  temporal models for individual person action labels, but 
  without an additional group-level LSTM.
