type: multi-stage
device: "cuda" # the device used in training and extraction process

stage1:
  
  data:
    data_cls: VolleyballPlayerDataset
    undersample_maj: false
    undersample_precent: 0.6
    use_wrs: false
    resize_dims: [256, 256]

  model:
    backbone: resnet50
    num_classes: 9

  training:
    epochs: 10
    train_batch_size: 64
    val_batch_size: 256
    lr: !!float 3e-4
    optimizer: AdamW
    weight_decay: 0.001

    scheduler:
      type: ReduceLROnPlateau
      factor: 0.1
      patience: 4
      threshold: !!float 1e-3
      min_lr: !!float 1e-5

stage2:

  extraction_process:
    data_cls: VolleyballGroupDataset
    imgs_per_clip: 1
    group_level: false

    batch_size: 90
    pool: true
    save_dir_name: b3_embds
  
  model:
    input_size: 2048
    hidden_layer_sizes: [1024, 512, 128]
    p_dropout: 0.2
    num_classes: 8

  training:
    epochs: 15
    train_batch_size: 128
    val_batch_size: 256
    lr: !!float 7e-4
    optimizer: AdamW
    weight_decay: 0.001

    scheduler:
      type: ReduceLROnPlateau
      factor: 0.5
      patience: 4
      threshold: !!float 1e-3
      min_lr: !!float 1e-4

description: >
  The resnet50 model on each player is fine-tuned to recognize
  person-level actions (Stage 1), then, fc7(2048-feature layer) is pooled over all players
  and used to train an MLP for group activity recognition (Stage 2).
